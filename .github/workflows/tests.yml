name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    # librtp.so needs GLIBC >= 2.27 (built in Ubuntu 18.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install system libraries (Qt offscreen, Tk, rsync)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 \
            tk rsync

      - name: Install CPU PyTorch and the package with test extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install ".[test]"

      - name: Run tests (no GPU, no AFNI, not slow)
        run: python -m pytest -m "not gpu and not afni and not slow" -ra --durations=10
