name: RTPSpy
channels:
  - conda-forge
dependencies:
  - cmake
  - dcm2niix
  - f2c
  - openpyxl
  - pexpect
  - pip
  - psutil
  - pydicom
  - pyqt=5
  - pyserial
  - python=3.12
  - scikit-sparse
  - six
  - watchdog
  - pip:
    # PyTorch with CUDA 13.0 (requires NVIDIA driver >= 580).
    # Replace cu130 with cu126 for older drivers, or cpu for CPU-only.
    - --extra-index-url https://download.pytorch.org/whl/cu130
    # FastSurfer v2.6.0 pinned requirements (torch 2.14, numpy 2.x, ...)
    - -r rtpspy/FastSurfer/requirements.txt
    - antspyx
