[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "RTPSpy"
version = "2.0.0.dev0"
description = "fMRI Real-Time Processing System in python"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Masaya Misaki", email = "mamisaki@gmail.com" }]
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
# Imported by rtpspy (excluding rtpspy/FastSurfer), tested with Python 3.13
# and the newest versions available for it (2026-11). Python 3.14 and later
# are not used yet: antspyx has no wheels for them (antspyx 0.6.3 also caps
# numpy < 2.4 and scipy < 1.16).
# install.sh installs these with uv (PyTorch for the detected GPU driver) and
# pulls the AFNI and FastSurfer containers. dcm2niix is the PyPI package that
# ships the dcm2niix program.
dependencies = [
    "numpy>=2.3",
    "scipy>=1.15",
    "nibabel>=5.5",
    "pandas>=3.0",
    "torch>=2.14",
    "pydicom>=3.0.2",
    "watchdog>=7.0",
    "psutil>=7.2",
    "pyserial>=3.5",
    "PyQt6>=6.12",
    "matplotlib>=3.11",
    "cycler>=0.12",
    "antspyx>=0.6.3",
    "dcm2niix>=1.0.20261029",
]

[project.optional-dependencies]
# Segmentation with a local FastSurfer clone instead of the FastSurfer
# container (install.sh). FastSurfer itself is not a pip package: clone it
# into rtpspy/FastSurfer and install its pinned requirements with
#   pip install -r rtpspy/FastSurfer/requirements.txt
# The list below is the core of FastSurfer v2.6.0 requirements.
fastseg = [
    "h5py>=3.7",
    "lapy>=1.5.0",
    "scikit-image>=0.19.3",
    "scikit-learn>=1.2.2",
    "simpleitk>=2.2.1",
    "torchio>=0.18.83",
    "torchvision>=0.17",
    "pyyaml>=6.0",
    "tqdm>=4.65",
    "yacs>=0.1.8",
]
# Optional: monitor geometry for the window layout (falls back to tkinter)
gui = ["screeninfo>=0.8.1"]
test = ["pytest>=9.0"]

[project.urls]
Homepage = "https://github.com/mamisaki/RTPSpy"
Repository = "https://github.com/mamisaki/RTPSpy"

[tool.setuptools]
# The rtpspy package and its GUI subpackage (rtpspy.ui). rtpspy/FastSurfer
# (a separate clone) is not packaged.
# rtpspy/containers.py is also run as a script by the AFNI wrappers.
packages = ["rtpspy", "rtpspy.ui"]
include-package-data = false
# Installed as a command (rtp_imgproc looks for ants_run.py on PATH)
script-files = ["rtpspy/ants_run.py"]

[tool.setuptools.package-data]
rtpspy = ["librtp.so", "librtp.dylib"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Import rtpspy from the source tree when it is not installed
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = [
    "gpu: needs a CUDA device",
    "afni: needs the AFNI command-line programs",
    "slow: takes more than ~20 s",
]
